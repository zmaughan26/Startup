<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Tell browsers not to scale the viewport automatically -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyTrack</title>
    <link rel="icon" href="studytrack-favicon.svg" />
  </head>
  <body>
    <!-- Use header, main, and footer elements to give semantic structure -->
    <header>
      <h1>StudyTrack<sup>&reg;</sup></h1>

      <!-- Navigation elements -->
      <nav>
        <!-- Menu is a semantic alternative to <ul> that represents an interaction -->
        <menu>
          <li><a href="index.html">Home</a></li>
          <li><a href="myassignments.html">My Assignments</a></li>
          <li><a href="completed.html">Completed Assignments</a></li>
          <li><a href="about.html">About</a></li>
        </menu>
      </nav>

      <!-- Since we don't have the ability to style we use old style HTML to give some visual formatting -->
      <hr />
    </header>

    <main>
      <div class="users">
        User:
        <span class="users">Student Name</span>
      </div>
      <ul class="notification">
        <li class="users">CALC HW 2.1 | Due: May 15, 2023</li>
        <li class="users">Read Chapter 5 | Due: May 20, 2023</li>
        <li class="users">Write Reflection | Due: May 25, 2023</li>
      </ul>

      <!-- More formatting with old style HTML -->
      <br />

      <div>
        <button type="submit">Add Assignment</button>
        <input type="text" placeholder="Assignment Name" />
      </div>

      <br />
      <div>
        <button type="submit">Edit Assignment</button>
        <input type="text" placeholder="Assignment Name" />
    </main>

    <footer>
      <hr />
      <span class="text-reset">Author Name: Zach Maughan</span>
      <br />
      <a href="https://github.com/zmaughan26/studytrack-html"
      >GitHub</a>
    </footer>
  </body>
</html>
